<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#26a641" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bgGrad)" stroke="#30363d" stroke-width="3" />

  <!-- Calendar dots grid (GitHub style) -->
  <!-- Col 1 -->
  <rect x="22" y="26" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="22" y="42" width="12" height="12" rx="3" fill="#0e4429" />
  <rect x="22" y="58" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="22" y="74" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="22" y="90" width="12" height="12" rx="3" fill="#0e4429" />

  <!-- Col 2 -->
  <rect x="38" y="26" width="12" height="12" rx="3" fill="#0e4429" />
  <rect x="38" y="42" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="38" y="58" width="12" height="12" rx="3" fill="#39d353" filter="url(#glow)" />
  <rect x="38" y="74" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="38" y="90" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 3 -->
  <rect x="54" y="26" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="54" y="42" width="12" height="12" rx="3" fill="#39d353" />
  <rect x="54" y="58" width="12" height="12" rx="3" fill="#39d353" filter="url(#glow)" />
  <rect x="54" y="74" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="54" y="90" width="12" height="12" rx="3" fill="#006d32" />

  <!-- Col 4 -->
  <rect x="70" y="26" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="70" y="42" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="70" y="58" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="70" y="74" width="12" height="12" rx="3" fill="#39d353" filter="url(#glow)" />
  <rect x="70" y="90" width="12" height="12" rx="3" fill="#0e4429" />

  <!-- Col 5 -->
  <rect x="86" y="26" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="86" y="42" width="12" height="12" rx="3" fill="#26a641" />
  <rect x="86" y="58" width="12" height="12" rx="3" fill="#39d353" filter="url(#glow)" />
  <rect x="86" y="74" width="12" height="12" rx="3" fill="#006d32" />
  <rect x="86" y="90" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- AI spark badge overlay in corner -->
  <g transform="translate(88, 14)">
    <circle cx="14" cy="14" r="14" fill="#0d1117" stroke="#39d353" stroke-width="2" />
    <path d="M14 6 L16 11 L21 14 L16 17 L14 22 L12 17 L7 14 L12 11 Z" fill="#39d353" />
  </g>
</svg>